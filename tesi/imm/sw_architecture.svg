<svg viewBox="0 0 1520 730" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- COMPUTER HOST -->
  <rect x="20" y="70" width="600" height="580" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="320" y="98" text-anchor="middle" font-size="18" font-weight="bold">Computer Host (Windows 11, 64-bit)</text>
  <rect x="45" y="115" width="550" height="510" rx="4" fill="#eef7e9" stroke="#5a9216" stroke-width="2"/>
  <text x="320" y="143" text-anchor="middle" font-size="16" font-weight="bold">Script Python di automazione (venv)</text>

  <rect x="70" y="160" width="500" height="55" rx="4" fill="#8ed12f" stroke="#5a9216" stroke-width="2"/>
  <text x="320" y="193" text-anchor="middle" font-size="15" font-weight="bold">Orchestrazione - BenchmarkRunner</text>

  <g font-size="13.5" text-anchor="middle">
    <rect x="70"  y="240" width="240" height="62" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="2.5"/>
    <text x="190" y="266" font-weight="bold">Backend PMIC</text>
    <text x="190" y="286" font-size="12">misura del consumo</text>
    <rect x="330" y="240" width="240" height="62" rx="4" fill="#dbeafe" stroke="#2d6cc0" stroke-width="2"/>
    <text x="450" y="266" font-weight="bold">Comunicazione SSH</text>
    <text x="450" y="286" font-size="12">(Paramiko) - llama-cli</text>

    <rect x="70"  y="320" width="240" height="62" rx="4" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
    <text x="190" y="346" font-weight="bold">Parsing llama.cpp</text>
    <text x="190" y="366" font-size="12">t/s e testo generato</text>
    <rect x="330" y="320" width="240" height="62" rx="4" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
    <text x="450" y="346" font-weight="bold">Valutazione qualita'</text>
    <text x="450" y="366" font-size="12">scoring per benchmark</text>

    <rect x="70"  y="400" width="240" height="62" rx="4" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
    <text x="190" y="426" font-weight="bold">Monitoraggio termico</text>
    <text x="190" y="446" font-size="12">temperatura, throttling</text>
    <rect x="330" y="400" width="240" height="62" rx="4" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
    <text x="450" y="426" font-weight="bold">Analisi e grafici</text>
    <text x="450" y="446" font-size="12">pandas, matplotlib</text>

    <rect x="70"  y="480" width="240" height="62" rx="4" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
    <text x="190" y="506" font-weight="bold">Caricamento dataset</text>
    <text x="190" y="526" font-size="12">5 benchmark (JSONL)</text>
    <rect x="330" y="480" width="240" height="62" rx="4" fill="#f0f0f0" stroke="#777" stroke-width="2"/>
    <text x="450" y="506" font-weight="bold">Configurazione</text>
    <text x="450" y="526" font-size="12">config.json</text>
  </g>

  <rect x="70" y="560" width="500" height="48" rx="4" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="320" y="590" text-anchor="middle" font-size="13.5" font-weight="bold">Risultati: CSV + grafici comparativi</text>

  <!-- RASPBERRY PI 5 -->
  <rect x="900" y="70" width="600" height="580" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="1200" y="98" text-anchor="middle" font-size="18" font-weight="bold">Raspberry Pi 5 (Raspberry Pi OS, 64-bit)</text>
  <rect x="1070" y="120" width="260" height="70" rx="4" fill="#fffd54" stroke="#c9c400" stroke-width="2"/>
  <text x="1200" y="164" text-anchor="middle" font-size="20" font-weight="bold">llama.cpp</text>
  <line x1="1200" y1="190" x2="1017" y2="220" stroke="#333" stroke-width="1.6"/>
  <line x1="1200" y1="190" x2="1197" y2="220" stroke="#333" stroke-width="1.6"/>
  <line x1="1200" y1="190" x2="1377" y2="220" stroke="#333" stroke-width="1.6"/>

  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="935"  y="220" width="165" height="70" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1017" y="260">Llama3.2-3B, Q4</text>
    <rect x="1115" y="220" width="165" height="70" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1197" y="260">Gemma2-2B, Q4</text>
    <rect x="1295" y="220" width="165" height="70" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1377" y="260">Qwen2.5-1.5B, Q4</text>
    <rect x="935"  y="305" width="165" height="70" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1017" y="345">Llama3.2-3B, Q8</text>
    <rect x="1115" y="305" width="165" height="70" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1197" y="345">Gemma2-2B, Q8</text>
    <rect x="1295" y="305" width="165" height="70" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1377" y="345">Qwen2.5-1.5B, Q8</text>
  </g>

  <!-- PMIC -->
  <rect x="935" y="420" width="525" height="120" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="2.5"/>
  <text x="1197" y="450" text-anchor="middle" font-size="16" font-weight="bold">PMIC del Raspberry Pi 5</text>
  <text x="1197" y="478" text-anchor="middle" font-size="13">letto via vcgencmd pmic_read_adc (12 rami: I x V)</text>
  <text x="1197" y="504" text-anchor="middle" font-size="13">stato termico: measure_temp, get_throttled</text>
  <text x="1197" y="528" text-anchor="middle" font-size="12">alimentazione: alimentatore ufficiale (5,1 V / 3 A)</text>

  <!-- ETHERNET (SSH) -->
  <polyline points="320,608 320,675 1197,675 1197,546" fill="none" stroke="#000" stroke-width="2.5"/>
  <polyline points="1189,556 1197,540 1205,556" fill="none" stroke="#000" stroke-width="2.5"/>
  <polyline points="450,240 640,240 640,150 900,150" fill="none" stroke="#2d6cc0" stroke-width="2"/>
  <text x="760" y="700" text-anchor="middle" font-size="14" font-weight="bold">Cavo Ethernet (SSH)</text>
  <text x="760" y="128" text-anchor="middle" font-size="12.5" fill="#2d6cc0" font-weight="bold">shell interattiva llama-cli + connessione SSH dedicata al PMIC</text>
</svg>
