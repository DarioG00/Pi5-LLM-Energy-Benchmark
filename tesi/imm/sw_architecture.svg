<svg viewBox="0 0 1520 710" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L11,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- ===================== COMPUTER HOST ===================== -->
  <rect x="20" y="80" width="560" height="560" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="300" y="106" text-anchor="middle" font-size="18" font-weight="bold">Computer Host (Windows 11, 64-bit)</text>

  <rect x="50" y="120" width="500" height="250" rx="4" fill="#e9d5ec" stroke="#b07cc6" stroke-width="2"/>
  <text x="300" y="144" text-anchor="middle" font-size="16" font-weight="bold">Otii 3 Desktop App</text>

  <rect x="80" y="155" width="440" height="195" rx="3" fill="#f1564c" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="179" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Otii Automation Toolbox</text>

  <rect x="110" y="195" width="380" height="140" rx="3" fill="#f9d2cf" stroke="#d98880" stroke-width="2"/>
  <text x="300" y="255" text-anchor="middle" font-size="15" font-weight="bold">Otii Server</text>
  <text x="300" y="280" text-anchor="middle" font-size="13">(Otii TCP Server API)</text>

  <rect x="80" y="430" width="430" height="180" rx="4" fill="#8ed12f" stroke="#5a9216" stroke-width="2"/>
  <text x="295" y="527" text-anchor="middle" font-size="16" font-weight="bold">Script Python di automazione</text>

  <line x1="250" y1="430" x2="250" y2="333" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="333" x2="345" y2="430" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===================== OTII ACE PRO ===================== -->
  <text x="735" y="272" text-anchor="middle" font-size="16" font-weight="bold">Otii Ace Pro</text>
  <rect x="650" y="285" width="170" height="115" rx="4" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
  <text x="735" y="322" text-anchor="middle" font-size="14" font-weight="bold">5 V, fino a 5 A</text>
  <text x="735" y="345" text-anchor="middle" font-size="12">(power monitor)</text>
  <rect x="635" y="330" width="15" height="24" fill="#333"/>
  <rect x="800" y="356" width="34" height="12" rx="2" fill="#333"/>

  <!-- USB host <-> Otii -->
  <line x1="580" y1="342" x2="650" y2="342" stroke="#000" stroke-width="2.5"/>
  <text x="615" y="333" text-anchor="middle" font-size="13">USB</text>

  <!-- Otii -> Pi (USB-C alimentazione) -->
  <line x1="834" y1="362" x2="940" y2="342" stroke="#111" stroke-width="4"/>
  <text x="885" y="408" text-anchor="middle" font-size="13">USB-C (alimentazione)</text>

  <!-- ===================== RASPBERRY PI 5 ===================== -->
  <rect x="940" y="80" width="560" height="540" rx="10" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="1220" y="106" text-anchor="middle" font-size="18" font-weight="bold">Raspberry Pi 5 (Raspberry Pi OS, 64-bit)</text>

  <rect x="1090" y="120" width="260" height="120" rx="4" fill="#fffd54" stroke="#c9c400" stroke-width="2"/>
  <text x="1220" y="188" text-anchor="middle" font-size="22" font-weight="bold">llama.cpp</text>

  <line x1="1220" y1="240" x2="1037" y2="280" stroke="#333" stroke-width="1.6"/>
  <line x1="1220" y1="240" x2="1217" y2="280" stroke="#333" stroke-width="1.6"/>
  <line x1="1220" y1="240" x2="1397" y2="280" stroke="#333" stroke-width="1.6"/>

  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="955"  y="280" width="165" height="75" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1037" y="323">Llama3.2-3B, Q4</text>
    <rect x="1135" y="280" width="165" height="75" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1217" y="323">Gemma2-2B, Q4</text>
    <rect x="1315" y="280" width="165" height="75" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1397" y="323">Qwen2.5-1.5B, Q4</text>

    <rect x="955"  y="370" width="165" height="75" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1037" y="413">Llama3.2-3B, Q8</text>
    <rect x="1135" y="370" width="165" height="75" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1217" y="413">Gemma2-2B, Q8</text>
    <rect x="1315" y="370" width="165" height="75" rx="3" fill="#f5a623" stroke="#c77f12" stroke-width="2"/>
    <text x="1397" y="413">Qwen2.5-1.5B, Q8</text>
  </g>

  <!-- ===================== ETHERNET (SSH) ===================== -->
  <polyline points="300,640 300,675 1220,675 1220,620" fill="none" stroke="#000" stroke-width="2.5"/>
  <text x="760" y="697" text-anchor="middle" font-size="14" font-weight="bold">Cavo Ethernet (SSH)</text>
</svg>
