<svg viewBox="0 0 1400 730" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- ===================== COMPUTER HOST ===================== -->
  <rect x="35" y="150" width="40" height="95" rx="4" fill="#3a3a3a"/>
  <rect x="85" y="140" width="150" height="105" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="145" y="245" width="30" height="20" fill="#3a3a3a"/>
  <rect x="120" y="265" width="80" height="10" rx="3" fill="#3a3a3a"/>
  <g fill="#2d8ad8">
    <rect x="120" y="160" width="22" height="22"/><rect x="146" y="160" width="22" height="22"/>
    <rect x="120" y="186" width="22" height="22"/><rect x="146" y="186" width="22" height="22"/>
  </g>
  <text x="135" y="300" text-anchor="middle" font-size="16" font-weight="bold">Computer Host</text>
  <text x="135" y="320" text-anchor="middle" font-size="13">(Windows 11, 64-bit)</text>

  <!-- ===================== OTII ACE PRO ===================== -->
  <rect x="540" y="150" width="280" height="140" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="2.5"/>
  <text x="680" y="188" text-anchor="middle" font-size="17" font-weight="bold">Otii Ace Pro</text>
  <text x="680" y="214" text-anchor="middle" font-size="14" font-weight="bold">5 V, fino a 5 A</text>
  <text x="680" y="236" text-anchor="middle" font-size="12">(power monitor)</text>
  <!-- porta USB verso host -->
  <rect x="525" y="200" width="15" height="26" fill="#333"/>
  <!-- uscita USB-C verso il Pi -->
  <rect x="658" y="284" width="44" height="14" rx="2" fill="#333"/>

  <!-- USB host <-> Otii (controllo/dati) -->
  <line x1="235" y1="205" x2="525" y2="213" stroke="#1f6fc4" stroke-width="3"/>
  <text x="375" y="196" text-anchor="middle" font-size="13" font-weight="bold">USB (controllo)</text>

  <!-- Cavo USB-C: alimentazione Otii -> Pi -->
  <polyline points="680,298 680,360 700,360 700,432" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="712" y="372" font-size="13" font-weight="bold">USB-C (alimentazione)</text>

  <!-- ===================== RASPBERRY PI 5 ===================== -->
  <rect x="470" y="432" width="620" height="258" rx="10" fill="#e8f5e9" stroke="#1b7a3d" stroke-width="3"/>
  <text x="640" y="672" text-anchor="middle" font-size="18" font-weight="bold">Raspberry Pi 5</text>

  <!-- porta USB-C Power in -->
  <rect x="645" y="434" width="110" height="34" rx="3" fill="#333"/>
  <text x="700" y="455" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">USB-C (Power in)</text>

  <!-- SoC e RAM -->
  <rect x="510" y="510" width="210" height="95" rx="4" fill="#cfe9cf" stroke="#1b7a3d" stroke-width="1.5"/>
  <text x="615" y="545" text-anchor="middle" font-size="13" font-weight="bold">CPU/GPU Broadcom</text>
  <text x="615" y="566" text-anchor="middle" font-size="12">BCM2712 2.4 GHz</text>
  <text x="615" y="584" text-anchor="middle" font-size="12">quad Cortex-A76</text>

  <rect x="740" y="510" width="150" height="95" rx="4" fill="#cfe9cf" stroke="#1b7a3d" stroke-width="1.5"/>
  <text x="815" y="552" text-anchor="middle" font-size="13" font-weight="bold">LPDDR4X</text>
  <text x="815" y="572" text-anchor="middle" font-size="12">RAM 8 GB</text>

  <!-- FAN header -->
  <rect x="915" y="472" width="72" height="42" rx="3" fill="#333"/>
  <text x="951" y="498" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">FAN</text>

  <!-- porte USB / Ethernet -->
  <rect x="915" y="525" width="150" height="48" rx="4" fill="#bdbdbd" stroke="#555" stroke-width="1.5"/>
  <text x="990" y="554" text-anchor="middle" font-size="13" font-weight="bold">USB</text>
  <rect x="915" y="585" width="150" height="48" rx="4" fill="#bdbdbd" stroke="#555" stroke-width="1.5"/>
  <text x="990" y="606" text-anchor="middle" font-size="12" font-weight="bold">Ethernet</text>
  <text x="990" y="623" text-anchor="middle" font-size="12" font-weight="bold">RJ45</text>

  <!-- ===================== VENTOLA ===================== -->
  <g transform="translate(1250,175)">
    <circle r="60" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <g fill="#dcdcdc" stroke="#555" stroke-width="1.5">
      <ellipse cx="0" cy="-32" rx="15" ry="28"/>
      <ellipse cx="0" cy="-32" rx="15" ry="28" transform="rotate(90)"/>
      <ellipse cx="0" cy="-32" rx="15" ry="28" transform="rotate(180)"/>
      <ellipse cx="0" cy="-32" rx="15" ry="28" transform="rotate(270)"/>
    </g>
    <circle r="12" fill="#333"/>
  </g>
  <text x="1250" y="258" text-anchor="middle" font-size="14" font-weight="bold">Ventola di raffreddamento</text>
  <text x="1250" y="276" text-anchor="middle" font-size="12">(connettore 4 pin)</text>
  <path d="M1215,212 C1120,320 1030,430 987,493" fill="none" stroke="#d11" stroke-width="3"/>

  <!-- ===================== ETHERNET ===================== -->
  <polyline points="120,330 120,710 990,710 990,633" fill="none" stroke="#6a1b9a" stroke-width="3"/>
  <text x="540" y="702" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">Cavo Ethernet</text>
</svg>
