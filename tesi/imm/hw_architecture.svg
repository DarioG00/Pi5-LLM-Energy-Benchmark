<svg viewBox="0 0 1400 770" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- COMPUTER HOST -->
  <rect x="35" y="150" width="40" height="95" rx="4" fill="#3a3a3a"/>
  <rect x="85" y="140" width="150" height="105" rx="6" fill="#fff" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="145" y="245" width="30" height="20" fill="#3a3a3a"/>
  <rect x="120" y="265" width="80" height="10" rx="3" fill="#3a3a3a"/>
  <g fill="#2d8ad8">
    <rect x="120" y="160" width="22" height="22"/><rect x="146" y="160" width="22" height="22"/>
    <rect x="120" y="186" width="22" height="22"/><rect x="146" y="186" width="22" height="22"/>
  </g>
  <text x="135" y="300" text-anchor="middle" font-size="16" font-weight="bold">Computer Host</text>
  <text x="135" y="320" text-anchor="middle" font-size="13">(Windows 11, 64-bit)</text>

  <!-- ALIMENTATORE UFFICIALE -->
  <rect x="560" y="150" width="290" height="120" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="2.5"/>
  <text x="705" y="188" text-anchor="middle" font-size="16" font-weight="bold">Alimentatore ufficiale</text>
  <text x="705" y="211" text-anchor="middle" font-size="16" font-weight="bold">Raspberry Pi 5</text>
  <text x="705" y="236" text-anchor="middle" font-size="14">USB-C, 5,1 V / 3 A (15 W)</text>
  <line x1="560" y1="210" x2="470" y2="210" stroke="#111" stroke-width="4"/>
  <rect x="440" y="196" width="30" height="28" rx="3" fill="#333"/>
  <text x="455" y="182" text-anchor="middle" font-size="12">rete 230 V</text>
  <rect x="683" y="264" width="44" height="14" rx="2" fill="#333"/>

  <!-- Cavo USB-C alimentazione -->
  <polyline points="705,278 705,360 700,360 700,432" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="712" y="372" font-size="13" font-weight="bold">USB-C (alimentazione)</text>

  <!-- RASPBERRY PI 5 -->
  <rect x="470" y="432" width="620" height="300" rx="10" fill="#e8f5e9" stroke="#1b7a3d" stroke-width="3"/>
  <text x="640" y="714" text-anchor="middle" font-size="18" font-weight="bold">Raspberry Pi 5</text>
  <rect x="645" y="434" width="110" height="34" rx="3" fill="#333"/>
  <text x="700" y="455" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">USB-C (Power in)</text>

  <!-- PMIC -->
  <rect x="500" y="486" width="200" height="86" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="2.5"/>
  <text x="600" y="513" text-anchor="middle" font-size="15" font-weight="bold">PMIC</text>
  <text x="600" y="533" text-anchor="middle" font-size="11">(misura del consumo,</text>
  <text x="600" y="549" text-anchor="middle" font-size="11">tensione e corrente dei rami</text>
  <text x="600" y="565" text-anchor="middle" font-size="11">letti via vcgencmd)</text>

  <!-- SoC e RAM -->
  <rect x="500" y="590" width="200" height="95" rx="4" fill="#cfe9cf" stroke="#1b7a3d" stroke-width="1.5"/>
  <text x="600" y="622" text-anchor="middle" font-size="13" font-weight="bold">CPU/GPU Broadcom</text>
  <text x="600" y="643" text-anchor="middle" font-size="12">BCM2712 2.4 GHz</text>
  <text x="600" y="661" text-anchor="middle" font-size="12">quad Cortex-A76</text>
  <rect x="720" y="590" width="160" height="95" rx="4" fill="#cfe9cf" stroke="#1b7a3d" stroke-width="1.5"/>
  <text x="800" y="632" text-anchor="middle" font-size="13" font-weight="bold">LPDDR4X</text>
  <text x="800" y="652" text-anchor="middle" font-size="12">RAM 8 GB</text>

  <!-- FAN header e porte -->
  <rect x="915" y="476" width="72" height="42" rx="3" fill="#333"/>
  <text x="951" y="502" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">FAN</text>
  <rect x="915" y="560" width="150" height="48" rx="4" fill="#bdbdbd" stroke="#555" stroke-width="1.5"/>
  <text x="990" y="589" text-anchor="middle" font-size="13" font-weight="bold">USB</text>
  <rect x="915" y="620" width="150" height="48" rx="4" fill="#bdbdbd" stroke="#555" stroke-width="1.5"/>
  <text x="990" y="644" text-anchor="middle" font-size="12" font-weight="bold">Ethernet</text>
  <text x="990" y="661" text-anchor="middle" font-size="12" font-weight="bold">RJ45</text>

  <!-- PMIC letto via SSH: percorso pulito dal PMIC alla porta Ethernet -->
  <polyline points="700,530 890,530 890,644 908,644" fill="none" stroke="#e65100" stroke-width="2.5"/>
  <polyline points="900,637 910,644 900,651" fill="none" stroke="#e65100" stroke-width="2.5"/>
  <text x="795" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">letto via SSH</text>

  <!-- VENTOLA -->
  <g transform="translate(1250,175)">
    <circle cx="0" cy="0" r="60" fill="#ffffff" stroke="#333" stroke-width="2.5"/>
    <g fill="#dcdcdc" stroke="#555" stroke-width="1.5">
      <ellipse cx="0" cy="-32" rx="15" ry="28"/>
      <ellipse cx="0" cy="-32" rx="15" ry="28" transform="rotate(90)"/>
      <ellipse cx="0" cy="-32" rx="15" ry="28" transform="rotate(180)"/>
      <ellipse cx="0" cy="-32" rx="15" ry="28" transform="rotate(270)"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#333"/>
  </g>
  <text x="1250" y="258" text-anchor="middle" font-size="14" font-weight="bold">Ventola di raffreddamento</text>
  <text x="1250" y="276" text-anchor="middle" font-size="12">(connettore 4 pin)</text>
  <polyline points="1215,212 1120,330 1030,440 987,497" fill="none" stroke="#d11" stroke-width="3"/>

  <!-- ETHERNET -->
  <polyline points="120,330 120,752 990,752 990,668" fill="none" stroke="#6a1b9a" stroke-width="3"/>
  <text x="540" y="744" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">Cavo Ethernet (SSH: comandi + lettura PMIC)</text>
</svg>
