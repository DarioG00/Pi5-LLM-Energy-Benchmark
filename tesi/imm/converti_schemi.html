<script>
  function svgSource(id){
    var svg=document.getElementById(id);
    var src=new XMLSerializer().serializeToString(svg);
    if(src.indexOf('xmlns=')===-1) src=src.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
    return src;
  }
  function dlSvg(id,name){
    var blob=new Blob([svgSource(id)],{type:'image/svg+xml;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=name+'.svg';document.body.appendChild(a);a.click();a.remove();
  }
  function dlPng(id,name){
    var svg=document.getElementById(id);
    var vb=(svg.getAttribute('viewBox')||'0 0 1400 800').split(/\s+/).map(Number);
    var w=vb[2], h=vb[3], scale=3;
    var url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svgSource(id))));
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
      var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.setTransform(scale,0,0,scale,0,0); ctx.drawImage(img,0,0,w,h);
      c.toBlob(function(b){ var a=document.createElement('a');a.href=URL.createObjectURL(b);
        a.download=name+'.png';document.body.appendChild(a);a.click();a.remove(); },'image/png');
    };
    img.src=url;
  }
</script>
